{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Set Saldo Awal</h4>
  <a href="/bantuan/{{.Bantuan.ID}}/bku" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Kembali</a>
</div>

<form method="post" class="card">
  <div class="card-body">
    <div class="alert alert-info small mb-3">
      Saldo awal akan menjadi entri nomor 1 di Buku Kas Umum dan Buku Kas Bank dengan uraian "Saldo Awal".
    </div>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Saldo Awal (Rp)</label>
        <input type="text" class="form-control money-input" name="saldo_awal" value="{{if .Saldo}}{{fmtMoneyNoRp .Saldo}}{{end}}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Tanggal</label>
        <input type="date" class="form-control" name="tanggal" value="{{.Tanggal}}">
      </div>
    </div>
  </div>
  <div class="card-footer">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Simpan</button>
  </div>
</form>
{{end}}
