{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">{{if .B}}Edit Bantuan{{else}}Tambah Bantuan{{end}}</h4>
  <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Kembali</a>
</div>

<form method="post" class="card">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nama Bantuan</label>
        <input type="text" class="form-control" name="nama" value="{{.B.Nama}}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Nama Sekolah</label>
        <input type="text" class="form-control" name="nama_sekolah" value="{{.B.NamaSekolah}}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Nama Rekening (Bank Penerima)</label>
        <input type="text" class="form-control" name="bank_penerima" value="{{.B.NamaRekening}}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Nomor Rekening</label>
        <input type="text" class="form-control" name="no_rekening" value="{{.B.NomorRekening}}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Bank Bantuan (Pemerintah)</label>
        <input type="text" class="form-control" name="bank_bantuan" value="{{.B.Bank}}">
      </div>
      <div class="col-md-4">
        <label class="form-label">NPWP Sekolah</label>
        <input type="text" class="form-control" name="npwp" value="{{.B.NPWP}}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Kepala Sekolah</label>
        <input type="text" class="form-control" name="kepala_sekolah" value="{{.B.KepalaSekolah}}">
      </div>
      <div class="col-md-6">
        <label class="form-label">NIP Kepala Sekolah</label>
        <input type="text" class="form-control" name="nip_kepala" value="{{.B.NIPKepalaSekolah}}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Bendahara</label>
        <input type="text" class="form-control" name="bendahara" value="{{.B.Bendahara}}">
      </div>
      <div class="col-md-6">
        <label class="form-label">NIP Bendahara</label>
        <input type="text" class="form-control" name="nip_bendahara" value="{{.B.NIPBendahara}}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Besaran Dana (Rp)</label>
        <input type="text" class="form-control money-input" name="nominal" value="{{if .B.Nominal}}{{fmtMoneyNoRp .B.Nominal}}{{end}}">
      </div>
    </div>
  </div>
  <div class="card-footer">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Simpan</button>
  </div>
</form>
{{end}}
