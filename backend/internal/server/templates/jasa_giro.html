{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0"><i class="bi bi-piggy-bank"></i> Jasa Giro</h4>
  <a href="/bantuan/{{.Bantuan.ID}}/jasa-giro/tambah" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Tambah</a>
</div>
<div class="card">
  <div class="table-responsive">
    <table class="table table-sm table-hover">
      <thead class="table-light">
        <tr><th>No</th><th>Tanggal</th><th>Uraian</th><th class="text-end">Nominal</th><th class="text-end">Aksi</th></tr>
      </thead>
      <tbody>
        {{range $i, $j := .JasaGiro}}
        <tr>
          <td>{{inc $i}}</td>
          <td>{{if $j.Tanggal}}{{dateID $j.Tanggal}}{{end}}</td>
          <td>{{$j.Uraian}}</td>
          <td class="text-end">{{fmtMoney $j.Nominal}}</td>
          <td class="text-end">
            <form method="post" action="/bantuan/{{$.Bantuan.ID}}/jasa-giro/hapus/{{$j.ID}}" class="d-inline"
              onsubmit="return confirm('Hapus jasa giro ini beserta entri BKU terkait?');">
              <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
            </form>
          </td>
        </tr>
        {{else}}
        <tr><td colspan="5" class="text-center text-muted">Belum ada jasa giro.</td></tr>
        {{end}}
      </tbody>
      <tfoot class="table-light fw-bold"><tr><td colspan="4" class="text-end">TOTAL</td><td class="text-end">{{fmtMoney .Total}}</td></tr></tfoot>
    </table>
  </div>
</div>
{{end}}
