{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Tambah Jasa Giro</h4>
  {{if eq .Return "rekap"}}
  <a href="/bantuan/{{.Bantuan.ID}}/rekap-pajak" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Kembali</a>
  {{else}}
  <a href="/bantuan/{{.Bantuan.ID}}/jasa-giro" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Kembali</a>
  {{end}}
</div>
<form method="post" class="card">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Tanggal</label>
        <input type="date" class="form-control" name="tanggal" value="{{.Tanggal}}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Nominal (Rp)</label>
        <input type="text" class="form-control money-input" name="nominal">
      </div>
      <div class="col-md-4">
        <label class="form-label">Uraian</label>
        <input type="text" class="form-control" name="uraian" placeholder="Jasa Giro">
      </div>
    </div>
  </div>
  <div class="card-footer">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Simpan</button>
  </div>
</form>
{{end}}
