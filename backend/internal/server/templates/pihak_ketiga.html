{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0"><i class="bi bi-people"></i> Pihak Ketiga</h4>
  {{if .CanWrite}}<a href="/pihak-ketiga/tambah" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Tambah Pihak Ketiga</a>{{end}}
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-sm table-hover align-middle mb-0">
      <thead class="table-light">
        <tr><th>Nama</th><th>NPWP</th><th>Jumlah Rekening</th><th class="text-end">Aksi</th></tr>
      </thead>
      <tbody>
        {{range .Rows}}
        <tr>
          <td><b>{{.Nama}}</b></td>
          <td>{{if .NPWP}}{{formatNPWP .NPWP}}{{else}}-{{end}}</td>
          <td><span class="badge text-bg-secondary">{{len .Rekening}}</span></td>
          <td class="text-end">
            <a class="btn btn-outline-primary btn-sm" href="/pihak-ketiga/{{.ID}}">Rekening</a>
            {{if $.CanWrite}}
            <a class="btn btn-outline-secondary btn-sm" href="/pihak-ketiga/{{.ID}}/edit">Edit</a>
            <form method="post" action="/pihak-ketiga/{{.ID}}/hapus" class="d-inline" onsubmit="return confirm('Hapus pihak ketiga ini? Tagihan lama tetap menyimpan snapshot rekening.');">
              <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
              <button class="btn btn-outline-danger btn-sm" type="submit">Hapus</button>
            </form>
            {{end}}
          </td>
        </tr>
        {{else}}
        <tr><td colspan="4" class="text-center text-muted">Belum ada pihak ketiga.</td></tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
{{end}}
