{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">{{if .P.ID}}Edit Pencairan{{else}}Tambah Pencairan{{end}}</h4>
  <a href="/bantuan/{{.Bantuan.ID}}/pencairan" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Kembali</a>
</div>
<form method="post" class="card">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Tahap</label>
        <input type="text" class="form-control" value="Tahap {{if .P.Tahap}}{{.P.Tahap}}{{else}}berikutnya{{end}}" disabled>
      </div>
      <div class="col-md-4">
        <label class="form-label">Tanggal</label>
        <input type="date" class="form-control" name="tanggal" value="{{.Tanggal}}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Nominal (Rp)</label>
        <input type="text" class="form-control money-input" name="nominal" value="{{if .P.Nominal}}{{fmtMoneyNoRp .P.Nominal}}{{end}}">
      </div>
      <div class="col-12">
        <label class="form-label">Keterangan</label>
        <input type="text" class="form-control" name="keterangan" value="{{.P.Keterangan}}">
      </div>
    </div>
  </div>
  <div class="card-footer">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Simpan</button>
  </div>
</form>
{{end}}
